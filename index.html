<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For Someone Special ❤️</title>

  <style>
    body{
      margin:0;
      padding:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      font-family:Arial, sans-serif;
      overflow:hidden;
    }

    .card{
      background:white;
      padding:40px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      animation:fadeIn 2s ease;
    }

    h1{
      color:#ff4d6d;
      font-size:40px;
    }

    p{
      font-size:20px;
      color:#444;
    }

    .heart{
      font-size:60px;
      animation:beat 1s infinite;
    }

    button{
      margin-top:20px;
      padding:12px 25px;
      border:none;
      border-radius:30px;
      background:#ff4d6d;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.1);
      background:#e63956;
    }

    @keyframes beat{
      0%{transform:scale(1);}
      50%{transform:scale(1.2);}
      100%{transform:scale(1);}
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="heart">❤️</div>

    <h1>Hello My Love</h1>

    <p>
      You are the most special person in my life ✨
    </p>

    <button onclick="showMessage()">
      Click Me
    </button>
  </div>

  <script>
    function showMessage(){
      alert("I Love You Forever ❤️");
    }
  </script>

</body>
</html>
